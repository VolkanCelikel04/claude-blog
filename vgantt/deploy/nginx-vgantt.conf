# /etc/nginx/sites-available/vgantt
#
# TLS termination + reverse proxy. The API itself listens on 127.0.0.1:3000 and
# is not reachable from outside this host.

upstream vgantt_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.ornek.com.tr;

    # certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.ornek.com.tr;

    ssl_certificate     /etc/letsencrypt/live/panel.ornek.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.ornek.com.tr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Login and refresh are the endpoints worth rate limiting.
    location = /api/auth/login       { limit_req zone=vgantt_auth burst=5 nodelay; proxy_pass http://vgantt_api; include /etc/nginx/proxy_params; }
    location = /api/auth/admin/login { limit_req zone=vgantt_auth burst=5 nodelay; proxy_pass http://vgantt_api; include /etc/nginx/proxy_params; }

    location /api/ {
        proxy_pass http://vgantt_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The built React app. Vite output goes to apps/web/dist.
    root /opt/vgantt/apps/web/dist;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }

    location ~* \.(js|css|woff2|svg|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Put this in the http{} block of nginx.conf:
# limit_req_zone $binary_remote_addr zone=vgantt_auth:10m rate=10r/m;
